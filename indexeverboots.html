<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Everboots Creator Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: dark "oiled leather" band on top with the nav, then a work-surface ground of cards.
   Signature detail: stitched (dashed) welt borders on the cards that matter most. */
:root {
  --bg: #efede9;
  --surface: #fbfaf8;
  --surface-2: #f4f1ec;
  --ink: #1f1a16;
  --muted: #6b625a;
  --line: #ddd6cd;
  --band: #2a1f17;
  --band-ink: #f3ebe1;
  --band-muted: #c9b8a6;
  --copper: #b45f25;
  --copper-ink: #ffffff;
  --copper-soft: #f6e6d8;
  --stitch: #c99a63;
  --good: #2f7a45;
  --good-soft: #e3f1e6;
  --warn: #a8670b;
  --warn-soft: #fbefd9;
  --bad: #b3322a;
  --bad-soft: #f9e2df;
  --chart: #b45f25;
  --chart-fill: rgba(180, 95, 37, .14);
  --shadow: 0 1px 2px rgba(40, 28, 18, .06), 0 2px 10px rgba(40, 28, 18, .05);
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171310; --surface: #211b17; --surface-2: #2a231d; --ink: #f1e9df; --muted: #b3a597; --line: #3b322a;
    --band: #0f0c0a; --band-ink: #f3ebe1; --band-muted: #b9a693; --copper: #d77a3a; --copper-ink: #1a120c; --copper-soft: #3a261a;
    --stitch: #a7804f; --good: #6cc285; --good-soft: #1f3324; --warn: #e3a94a; --warn-soft: #3a2c14; --bad: #ef7d73; --bad-soft: #3d1f1c;
    --chart: #e08a4c; --chart-fill: rgba(224, 138, 76, .16); --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171310; --surface: #211b17; --surface-2: #2a231d; --ink: #f1e9df; --muted: #b3a597; --line: #3b322a;
  --band: #0f0c0a; --band-ink: #f3ebe1; --band-muted: #b9a693; --copper: #d77a3a; --copper-ink: #1a120c; --copper-soft: #3a261a;
  --stitch: #a7804f; --good: #6cc285; --good-soft: #1f3324; --warn: #e3a94a; --warn-soft: #3a2c14; --bad: #ef7d73; --bad-soft: #3d1f1c;
  --chart: #e08a4c; --chart-fill: rgba(224, 138, 76, .16); --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
h1, h2, h3, h4 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: .01em; }
p { margin: 0; }
a { color: var(--copper); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header band */
.band { background: var(--band); color: var(--band-ink); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; line-height: 1; }
.brand b { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .08em; }
.brand span { font-size: 11.5px; color: var(--band-muted); letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-band { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 6px; border: 1px solid rgba(243,235,225,.22); background: transparent; color: var(--band-ink); font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; }
.btn-band:hover { background: rgba(243,235,225,.08); }
.btn-band.solid { background: var(--copper); border-color: var(--copper); color: var(--copper-ink); }
.seg { display: inline-flex; border: 1px solid rgba(243,235,225,.22); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--band-muted); padding: 6px 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--band-ink); color: var(--band); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-top: 1px solid rgba(243,235,225,.1); }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { flex: none; padding: 11px 12px; color: var(--band-muted); text-decoration: none; font-size: 13.5px; font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs a:hover { color: var(--band-ink); }
nav.tabs a[aria-current="page"] { color: var(--band-ink); border-bottom-color: var(--copper); }
.count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--copper); color: var(--copper-ink); font-size: 11px; text-align: center; line-height: 18px; }
.hero { padding-block: 26px 30px; }
.hero h1 { font-size: clamp(30px, 5vw, 44px); font-weight: 800; text-transform: uppercase; letter-spacing: .02em; line-height: 1.02; }
.hero p { color: var(--band-muted); max-width: 62ch; margin-top: 8px; }

/* Page */
main { padding-block: 24px 48px; }
.view { display: grid; gap: 18px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.grid-2 > *, .stack > * { min-width: 0; }
.stack { display: grid; gap: 18px; align-content: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.welt { border: 1.5px dashed var(--stitch); outline: 4px solid var(--surface); outline-offset: -6px; }
.card h2 { font-size: 22px; font-weight: 700; }
.card h3 { font-size: 18px; font-weight: 700; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.small { font-size: 12.5px; color: var(--muted); }
.eyebrow { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--copper); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--copper); border-color: var(--copper); color: var(--copper-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.dark { background: var(--band); border-color: var(--band); color: var(--band-ink); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--copper); font-weight: 600; cursor: pointer; font-size: 13px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--band); color: var(--band-ink); border-color: var(--band); }
.tag { display: inline-block; padding: 2px 8px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.ex { background: var(--copper-soft); color: var(--copper); letter-spacing: .04em; text-transform: uppercase; font-size: 10.5px; }
.note-strip { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--ink); font-size: 13px; border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
.note-strip b { color: var(--warn); }
ol.check { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
ol.check li::marker { font-family: var(--mono); font-size: 12px; color: var(--copper); font-weight: 600; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 6px; }

.focus { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: start; padding: 22px; }
.focus .boot-ico { width: 72px; height: 72px; }
.focus .boot-ico svg { width: 48px; height: 48px; }
.focus-main p { max-width: 62ch; }
.focus-stats { display: grid; gap: 12px; padding-left: 18px; border-left: 1px solid var(--line); min-width: 150px; }
.focus-stats .val { font-family: var(--mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.star { color: var(--copper); }
.chip[aria-pressed="true"] .star { color: var(--stitch); }
.cta { background: var(--copper); color: var(--copper-ink); border: 0; }
.cta p { opacity: .92; margin-top: 4px; font-size: 14px; }
.cta .btn { margin-top: 12px; background: var(--copper-ink); color: var(--copper); border-color: var(--copper-ink); }
.cta-dark { background: var(--band); color: var(--band-ink); border: 0; }
.cta-dark p { color: var(--band-muted); margin-top: 4px; font-size: 14px; }
.cta-dark .btn { margin-top: 12px; }

.hooks { display: grid; gap: 2px; }
.hook-row { display: flex; justify-content: space-between; gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.hook-row:first-child { border-top: 0; }
.copy { flex: none; border: 0; background: none; color: var(--copper); font-weight: 700; font-size: 12.5px; cursor: pointer; padding: 2px 4px; }

/* KPIs + chart */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; }
.kpi .lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
.kpi .val { font-family: var(--mono); font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
.delta { font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; }
.chart-tip { position: absolute; pointer-events: none; background: var(--band); color: var(--band-ink); font-size: 12px; padding: 6px 9px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%); font-family: var(--mono); }
.vid { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.vid:first-of-type { border-top: 0; }
.rank { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--copper); line-height: 1; }
.vid .meta { font-size: 12.5px; color: var(--muted); }
.vid .money { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.quote { font-style: italic; color: var(--ink); margin-top: 3px; }

/* Scripts */
.scripts { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-items: start; }
.script { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); min-width: 0; }
.script-top { padding: 14px 16px 10px; display: grid; gap: 6px; }
.script-top .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.script-num { font-family: var(--mono); font-size: 12px; color: var(--copper); font-weight: 600; }
.why { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.why b { color: var(--ink); display: block; font-size: 12.5px; }
.hookbox { background: var(--copper-soft); padding: 12px 16px; border-top: 1px solid var(--line); }
.hookbox .small { font-weight: 600; }
.hookbox p { font-size: 17px; font-weight: 600; margin-top: 2px; line-height: 1.35; }
.beat { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; padding: 9px 16px; border-top: 1px solid var(--line); font-size: 14px; }
.beat .t { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
.beat .show { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.caption { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13px; }
.script-foot { padding: 10px 16px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }

.builder { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 18px; align-items: start; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lbl { font-weight: 700; font-size: 13px; }
.form-grid { display: grid; gap: 14px; }
textarea, input[type="text"], input[type="email"], input[type="url"], input[type="number"], select { width: 100%; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); padding: 9px 10px; font-size: 14px; }
textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
.mono { font-family: var(--mono); font-size: 12.5px; }

/* Products */
.prod-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.boot-ico { width: 56px; height: 56px; flex: none; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; }
.boot-ico svg { width: 36px; height: 36px; }
.spec { border: 2px solid var(--ink); border-radius: 6px; padding: 12px 14px; background: var(--surface); }
.spec h3 { font-size: 24px; font-weight: 800; text-transform: uppercase; border-bottom: 6px solid var(--ink); padding-bottom: 4px; }
.spec-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.spec-row:last-child { border-bottom: 0; }
.spec-row b { font-weight: 700; }
.say-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.say-row:first-of-type { border-top: 0; }
.careful { border-left: 4px solid var(--warn); }
.qa { border-top: 1px solid var(--line); padding: 10px 0; }
.qa:first-of-type { border-top: 0; }
.qa b { display: block; font-size: 14px; }

/* Claims table */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--display); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
td.no { color: var(--bad); }
td.yes { color: var(--good); }

/* Checker */
.gauge { display: grid; justify-items: center; gap: 2px; padding-block: 4px 10px; }
.gauge svg { width: 220px; max-width: 100%; height: auto; }
.gauge .num { font-family: var(--mono); font-size: 40px; font-weight: 600; margin-top: -78px; font-variant-numeric: tabular-nums; }
.gauge .num small { font-size: 16px; }
.gauge .verdict { font-weight: 700; margin-top: 18px; }
.flag { border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; background: var(--surface); }
.flag.high { border-left-color: var(--bad); }
.flag.low { border-left-color: var(--muted); }
.flag .fix { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
.flag-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.flags { display: grid; gap: 10px; }

.update { border-top: 1px solid var(--line); padding: 14px 0; display: grid; gap: 6px; }
.update:first-of-type { border-top: 0; padding-top: 0; }
.date { font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* Modal */
.modal-back { position: fixed; inset: 0; background: rgba(15, 10, 6, .55); display: grid; place-items: center; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); z-index: 50; }
.modal { background: var(--surface); color: var(--ink); border-radius: 12px; width: min(680px, 100%); max-height: calc(100% - 20px); overflow: auto; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.modal-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 14px; }
.x { border: 1px solid var(--line); background: var(--surface); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 16px; flex: none; }
.verdict-box { border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.verdict-box.good { background: var(--good-soft); }
.verdict-box.bad { background: var(--bad-soft); }
.verdict-box b { display: block; }
.mini-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 8px; margin-top: 12px; }
.mini-kpis > div { padding: 8px 10px; border-left: 1px solid var(--line); }
.mini-kpis > div:first-child { border-left: 0; }
.mini-kpis .val { font-family: var(--mono); font-weight: 600; font-size: 15px; }
.reason { background: var(--surface-2); border-radius: 7px; padding: 9px 12px; font-size: 13.5px; }
.reason b { display: block; }
.form2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form2 .full { grid-column: 1 / -1; }
.opt { font-weight: 400; color: var(--muted); font-size: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--band); color: var(--band-ink); padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 13.5px; z-index: 60; }
footer { padding-block: 20px 36px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); }

@media (max-width: 860px) {
  .grid-2, .builder { grid-template-columns: minmax(0, 1fr); }
  .focus { grid-template-columns: minmax(0, 1fr); }
  .focus .boot-ico { display: none; }
  .focus-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); padding-left: 0; border-left: 0; border-top: 1px solid var(--line); padding-top: 12px; min-width: 0; }
}
@media (max-width: 520px) {
  .form2 { grid-template-columns: minmax(0, 1fr); }
  .mini-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mini-kpis > div:nth-child(3) { border-left: 0; }
  .mini-kpis > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .scripts { grid-template-columns: minmax(0, 1fr); }
  .spec-row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
/* ------------------------------------------------------------------
   Settings. When this page is hosted outside claude.ai (for example on
   GitHub Pages), set APPLY_ENDPOINT to a Google Apps Script web app URL
   and retainer applications will POST there as JSON. Left empty, the
   form gives the creator a copyable application instead.
------------------------------------------------------------------- */

function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const SALES = {};
const SALES_CFG = {
  ultra: { base: 2650, gpm: 27.4, seed: 11, ch: { gmv: 18.4, units: 17.9, views: 9.6, gpm: 8.0, vids: 12.2, creators: 9.1, aov: 0.4 } },
  tanks: { base: 1880, gpm: 24.1, seed: 23, ch: { gmv: 6.2, units: 5.8, views: -3.4, gpm: 9.9, vids: 4.1, creators: 2.7, aov: 0.3 } },
  weldor: { base: 1360, gpm: 21.3, seed: 37, ch: { gmv: -7.5, units: -8.1, views: -12.0, gpm: 5.1, vids: -2.2, creators: -4.0, aov: 0.6 } },
  sierra: { base: 690, gpm: 31.8, seed: 41, ch: { gmv: 64.0, units: 61.2, views: 48.3, gpm: 10.6, vids: 71.0, creators: 55.4, aov: 1.7 } }
};
for (const p of PRODUCTS) {
  const c = SALES_CFG[p.id], r = rng(c.seed), days = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(DATA_AS_OF); d.setDate(d.getDate() - i);
    const trend = 1 + (29 - i) / 29 * (c.ch.gmv / 200);
    const wk = [0.92, 0.95, 1, 1.02, 1.04, 1.14, 1.08][d.getDay()];
    const spike = r() > 0.93 ? 1.45 : 1;
    const gmv = Math.round(c.base * trend * wk * spike * (0.82 + r() * 0.36));
    const units = Math.round(gmv / (p.price * (0.86 + r() * 0.04)));
    const views = Math.round(gmv / c.gpm * 1000 * (0.9 + r() * 0.2));
    const aff = Math.round(gmv * (0.62 + r() * 0.12));
    const posted = Math.round(c.base / 38 * (0.7 + r() * 0.6));
    days.push({ d, gmv, aff, units, views, posted });
  }
  const sum = (k) => days.reduce((a, x) => a + x[k], 0);
  SALES[p.id] = { days, gmv: sum("gmv"), units: sum("units"), views: sum("views"), posted: sum("posted"), creators: Math.round(sum("posted") * 0.46), ch: c.ch };
}

function checkText(text) {
  const flags = [];
  for (const r of RULES) {
    const m = [...new Set((text.match(r.re) || []).map(s => s.toLowerCase()))];
    if (m.length) flags.push({ r, hits: m });
  }
  let keep = 1; flags.forEach(f => keep *= (1 - f.r.w));
  const pct = text.trim() ? Math.max(3, Math.round((1 - keep) * 100)) : 0;
  return { flags, pct };
}

function drawChart() {
  const el = document.getElementById("chart"); if (!el) return;
  const days = SALES[sellProd].days, vals = days.map(d => d[metric]);
  const W = 720, H = 230, pl = 54, pr = 14, pt = 14, pb = 28;
  const max = Math.max(...vals) * 1.08, avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  const x = (i) => pl + i * (W - pl - pr) / (vals.length - 1), y = (v) => pt + (1 - v / max) * (H - pt - pb);
  const isMoney = metric === "gmv" || metric === "aff";
  const lab = (v) => isMoney ? fmtMoney(v) : fmtNum(Math.round(v));
  const line = vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area = `${line}L${x(vals.length - 1)},${y(0)}L${x(0)},${y(0)}Z`;
  const ticks = [0, max / 2, max];
  const li = vals.length - 1;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${T(METRICS[metric])}">
    ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${lab(t)}</text>`).join("")}
    <path d="${area}" fill="var(--chart-fill)"/>
    <path d="${line}" fill="none" stroke="var(--chart)" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="${pl}" x2="${W - pr}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--copper)" stroke-dasharray="4 4" stroke-width="1" opacity=".7"/>
    <text x="${W - pr}" y="${y(avg) - 5}" text-anchor="end" font-size="11" fill="var(--copper)" font-family="IBM Plex Mono, monospace">${lang === "es" ? "prom." : "avg"} ${lab(avg)}</text>
    <circle cx="${x(li)}" cy="${y(vals[li])}" r="4" fill="var(--chart)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${pl}" y="${H - 8}" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${fmtDate(days[0].d)}</text>
    <text x="${W - pr}" y="${H - 8}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${fmtDate(days[li].d)}</text>
    <line id="cursor" x1="0" x2="0" y1="${pt}" y2="${H - pb}" stroke="var(--muted)" stroke-width="1" opacity="0"/>
    <rect x="${pl}" y="${pt}" width="${W - pl - pr}" height="${H - pt - pb}" fill="transparent" id="hit"/>
  </svg><div class="chart-tip" id="tip" hidden></div>`;
  const svg = el.querySelector("svg"), tip = el.querySelector("#tip"), cur = el.querySelector("#cursor");
  const move = (e) => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(li, Math.round((sx - pl) / (W - pl - pr) * li)));
    cur.setAttribute("x1", x(i)); cur.setAttribute("x2", x(i)); cur.setAttribute("opacity", ".5");
    tip.hidden = false; tip.textContent = `${fmtDate(days[i].d)} · ${lab(vals[i])}`;
    tip.style.left = (x(i) / W * r.width) + "px"; tip.style.top = (y(vals[i]) / H * r.height) + "px";
  };
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerleave", () => { tip.hidden = true; cur.setAttribute("opacity", "0"); });
}

function buildScript() {
  const bl = builder.lang || lang, p = P(builder.p), r = rng(builder.seed * 7919 + builder.p.length * 31 + builder.len);
  const pick = (arr) => arr[Math.floor(r() * arr.length)];
  const L = (o) => o[bl] ?? o.en;
  const a = builder.angle;
  const hookBank = a === "demo" ? HOOKS.demo[builder.p] : HOOKS[a];
  const facts = [...p.say[bl] || p.say.en].sort(() => r() - 0.5);
  const nFacts = builder.len === 15 ? 1 : builder.len === 30 ? 2 : 3;
  const factShows = p.show[bl] || p.show.en;
  const beats = [{ say: L(pick(hookBank)), show: L(SHOWS.hook) }];
  for (let k = 0; k < nFacts; k++) beats.push({ say: facts[k] + ".", show: factShows[k % factShows.length] });
  if (builder.len >= 30) beats.push({ say: L(pick(PERSONAL[a])), show: L(SHOWS.personal) });
  if (builder.deal && a !== "deal") beats.push({ say: bl === "es" ? "Ahorita tiene oferta en el carrito." : "There's a deal in the cart right now.", show: L(SHOWS.cta) });
  beats.push({ say: L(pick(CTAS)).replace("{name}", p.name), show: L(SHOWS.cta) });
  const step = builder.len / beats.length;
  beats.forEach((b, i) => { b.t = `${Math.round(i * step)}–${Math.round((i + 1) * step)}s`; });
  return beats;
}
function beatsToText(beats) {
  const show = (builder.lang || lang) === "es" ? "mostrar" : "show";
  return beats.map(b => `[${b.t}] ${b.say}\n    (${show}: ${b.show})`).join("\n");
}

function vCheck() {
  const L = lang === "es";
  const text = checkerEdited ? checkerText.custom : T(checkerText);
  return `
  <div class="grid-2" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
    <section class="card">
      <div class="field"><label for="ctext">${L ? "Tu guion o texto" : "Your script or caption"} <span class="opt">${L ? "— pega lo que vas a decir o escribir" : "— paste what you'll say or write"}</span></label>

      <p class="small" style="margin-top:10px">${L ? "Esta revisión corre en tu navegador y busca palabras que suelen hacer que TikTok Shop marque videos de botas. Nada de lo que escribes se envía a ningún lado." : "This check runs in your browser and looks for wording that commonly gets boot videos flagged on TikTok Shop. Nothing you type is sent anywhere."}</p>
    </section>
    <section class="card">
      <h3>${L ? "Probabilidad de ser marcado" : "Violation likelihood"}</h3>
      <div class="gauge" id="gauge"></div>
      <div class="flags" id="cflags"></div>

  </div>`;
}
function updateChecker() {
  const ta = document.getElementById("ctext"); if (!ta) return;
  const L = lang === "es", { flags, pct } = checkText(ta.value);
  const col = pct >= 50 ? "var(--bad)" : pct >= 20 ? "var(--warn)" : "var(--good)";
  const verdict = !ta.value.trim() ? (L ? "Pega un guion para revisarlo" : "Paste a script to check it")
    : pct >= 70 ? (L ? "Muy probable que lo marquen" : "Very likely to be flagged") : pct >= 40 ? (L ? "Riesgo alto" : "High risk") : pct >= 20 ? (L ? "Algo de riesgo" : "Some risk") : (L ? "Se ve bien" : "Looks good");
  const R = 80, cx = 110, cy = 100, ang = Math.PI * (1 - pct / 100);
  const ex = cx + R * Math.cos(ang), ey = cy - R * Math.sin(ang);
  document.getElementById("gauge").innerHTML = `
    <svg viewBox="0 0 220 112" aria-hidden="true">
      <path d="M30,100 A80,80 0 0 1 190,100" fill="none" stroke="var(--surface-2)" stroke-width="16" stroke-linecap="round"/>
      ${pct > 0 ? `<path d="M30,100 A80,80 0 0 1 ${ex.toFixed(1)},${ey.toFixed(1)}" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round"/>` : ""}
    </svg>
    <div class="num" style="color:${col}">${pct}<small>%</small></div>
    <div class="verdict" style="color:${col}">${verdict}</div>
    <div class="small">${flags.length} ${L ? (flags.length === 1 ? "área de política activada" : "áreas de política activadas") : (flags.length === 1 ? "policy area triggered" : "policy areas triggered")}</div>`;
  document.getElementById("cflags").innerHTML = flags.map(flagHtml).join("");
}

      <label class="full" style="display:flex;gap:8px;align-items:start;font-size:13.5px"><input type="checkbox" id="a_agree" required style="margin-top:3px"> ${L ? "Acepto seguir las políticas de TikTok Shop y la guía de claims de Everboots en todo el contenido." : "I agree to follow TikTok Shop policy and Everboots' claims guide in all content."}</label>

async function submitApply(e) {
  e.preventDefault();
  const L = lang === "es", f = e.target, err = document.getElementById("a_err");
  const bad = [...f.querySelectorAll("[required]")].find(el => el.type === "checkbox" ? !el.checked : !el.value.trim() || (el.type === "email" && !/^\S+@\S+\.\S+$/.test(el.value)));
  if (bad) { err.textContent = L ? "Completa los campos marcados y revisa tu correo." : "Fill in the required fields and check your email address."; bad.focus(); return; }
  const g = (id) => document.getElementById(id).value.trim();
  const data = { submitted: new Date().toISOString(), name: g("a_name"), handle: g("a_handle"), email: g("a_email"), phone: g("a_phone"), followers: g("a_followers"), views: g("a_views"), languages: g("a_lang"), frequency: g("a_freq"), products: g("a_prod"), trade: g("a_trade"), link: g("a_link"), live: g("a_live"), why: g("a_why"), status: "New" };
  if (APPLY_ENDPOINT) {
    try {
      await fetch(APPLY_ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(data) });
      showModal(`<div class="modal-head"><h2 style="font-size:24px">${L ? "Solicitud enviada" : "Application sent"}</h2><button class="x" data-close aria-label="Close">✕</button></div><p>${L ? "Gracias. El equipo de Everboots te responderá por correo a" : "Thanks. The Everboots team will reply by email to"} <b>${esc(data.email)}</b>.</p>`);
      return;
    } catch (_) { /* fall through to the copyable version */ }
  }
  const text = Object.entries(data).filter(([k]) => k !== "status").map(([k, v]) => `${k}: ${v || "—"}`).join("\n");
  showModal(`<div class="modal-head"><h2 style="font-size:24px">${L ? "Tu solicitud está lista" : "Your application is ready"}</h2><button class="x" data-close aria-label="Close">✕</button></div>
    <p>${L ? "Copia esto y envíalo al equipo de Everboots por el canal donde te contactaron (Discord, correo o mensaje de TikTok)." : "Copy this and send it to the Everboots team wherever they reached you (Discord, email or TikTok message)."}</p>
    <textarea id="appText" class="mono" rows="12" readonly style="margin-top:10px">${esc(text)}</textarea>
    <div class="btn-row" style="margin-top:10px"><button class="btn primary" id="appCopy">${L ? "Copiar solicitud" : "Copy application"}</button><button class="btn" data-close>${L ? "Listo" : "Done"}</button></div>`);
  document.getElementById("appCopy").addEventListener("click", () => copyText(text, document.getElementById("appText")));
}

/* ---------------------------- Modal ---------------------------- */
let lastFocus = null;
function showModal(html) {
  const root = document.getElementById("modalRoot");
  if (!root.firstChild) lastFocus = document.activeElement;
  root.innerHTML = `<div class="modal-back" data-back><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const m = root.querySelector(".modal"); (m.querySelector("input, select, textarea, button") || m).focus();
}
function closeModal() { document.getElementById("modalRoot").innerHTML = ""; if (lastFocus) lastFocus.focus(); }

/* ---------------------------- Events ---------------------------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a");
  if (e.target.matches("[data-back]")) { closeModal(); return; }
  if (!t) return;
  const d = t.dataset;
  if (d.view) { e.preventDefault(); closeModal(); go(d.view); return; }
  if (d.close !== undefined) { closeModal(); return; }
  if (d.apply !== undefined || t.id === "applyTop") { openApply(); return; }
  if (d.copy) { copyText(d.copy); return; }
  if (d.focus) { sellProd = prodTab = "ultra"; scriptProd = "ultra"; builder.p = "ultra"; builder.text = null; go(d.focus); return; }
  if (d.video) { const [pid, i] = d.video.split(":"); openVideo(pid, +i); return; }
  if (d.sell) { sellProd = d.sell; render(); return; }
  if (d.metric) { metric = d.metric; render(); return; }
  if (d.sprod) { scriptProd = d.sprod; render(); return; }
  if (d.copyscript) { copyText(scriptText(SCRIPTS[+d.copyscript])); return; }
  if (d.scriptlang) { setLang(lang === "en" ? "es" : "en"); return; }
  if (d.ptab) { prodTab = d.ptab; render(); return; }
  if (d.bp) { builder.p = d.bp; builder.text = null; render(); return; }
  if (d.ba) { builder.angle = d.ba; builder.text = null; render(); return; }
  if (d.bl) { builder.len = +d.bl; builder.text = null; render(); return; }
  if (d.blang) { builder.lang = d.blang; builder.text = null; render(); return; }
  if (t.id === "bnew") { builder.seed++; builder.text = null; render(); return; }
  if (t.id === "bcopy") { copyText(document.getElementById("btext").value, document.getElementById("btext")); return; }
  if (t.id === "bcheck") { e.preventDefault(); checkerEdited = true; checkerText.custom = document.getElementById("btext").value; go("check"); return; }
  if (t.id === "cclear") { checkerEdited = true; checkerText.custom = ""; document.getElementById("ctext").value = ""; updateChecker(); document.getElementById("ctext").focus(); return; }
  if (t.id === "csample") { checkerEdited = false; render(); return; }
  if (t.id === "langEn") { setLang("en"); return; }
  if (t.id === "langEs") { setLang("es"); return; }
  if (t.id === "themeBtn") {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark"; store.set("eb-theme", root.dataset.theme);
    if (view === "selling") drawChart();
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "ctext") { checkerEdited = true; checkerText.custom = e.target.value; updateChecker(); }
  if (e.target.id === "btext") { builder.text = e.target.value; updateBuilderRisk(); }
});
document.addEventListener("change", (e) => { if (e.target.id === "bdeal") { builder.deal = e.target.checked; builder.text = null; render(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && document.getElementById("modalRoot").firstChild) closeModal(); });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS.includes(h) && h !== view) { view = h; render(); } });
function setLang(l) { lang = l; store.set("eb-lang", l); render(); }

render();
</script>
